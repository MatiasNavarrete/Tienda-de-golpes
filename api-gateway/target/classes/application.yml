server:
  port: 8097

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: pedido-service
          uri: lb://PEDIDO
          predicates:
            - Path=/api/pedidos/**

        - id: pago-service
          uri: lb://PAGO
          predicates:
            - Path=/api/pagos/**

        - id: envio-service
          uri: lb://ENVIO
          predicates:
            - Path=/api/envios/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true