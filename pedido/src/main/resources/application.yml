server:
  port: 8086

spring:
  application:
    name: pedido
  datasource:
    url: jdbc:mysql://localhost:3307/db_pedido
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.example.pedido: DEBUG
  file:
    name: logs/pedido.log

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true